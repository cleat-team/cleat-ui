# ---------------------------------------------------------------------------
# CI/CD Pipeline for cleat-ui (Svelte component library)
#
# Jobs:
#   build -- npm ci, run tests (if present), lint (if present), build
#
# ---------------------------------------------------------------------------
name: CI - cleat-ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ===========================================================================
# JOBS
# ===========================================================================
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
